name: Release Companion

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1-beta

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: bash scripts/build-app.sh release
      - name: Verify app bundle
        run: |
          test -x build/Companion.app/Contents/MacOS/Companion
          plutil -lint build/Companion.app/Contents/Info.plist
          test -s build/Companion.app/Contents/Resources/AppIcon.icns
          codesign --verify --deep --strict build/Companion.app
          test "$(defaults read "$PWD/build/Companion.app/Contents/Info" CFBundleShortVersionString)" = "0.1"
      - name: Package release
        run: ditto -c -k --sequesterRsrc --keepParent build/Companion.app Companion-macOS-0.1-beta.zip
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: Companion 0.1 Beta
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: |
            Companion 0.1 Beta

            Native macOS menu-bar workspace companion for AeroSpace.

            - macOS 26 or later
            - Apple Silicon build
            - Ad-hoc signed; not Developer ID signed or notarized
            - Screen Recording permission is optional and only needed for window thumbnails
          files: Companion-macOS-0.1-beta.zip
          prerelease: true
          make_latest: false
          generate_release_notes: true
